name: Compilación Android
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run android:check
      - name: Compilar recursos y proyecto nativo
        run: |
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      # Compilation only: no unconfigured APK is distributed to users.
  instalador:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-interno
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Preparar configuración privada de compilación
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node scripts/check-android.mjs --release
      - run: npm run android:sync
      - name: Preparar firma permanente
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: python3 scripts/prepare-android-signing.py
      - name: Compilar instalador firmado
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --no-daemon
      - name: Verificar firma e identidad del instalador
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt")
          test "$ACTUAL" = "$BUM_CERTIFICATE_SHA256"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.bumbumpasteleria.costos' versionCode='3' versionName='1.1.1'" "$RUNNER_TEMP/apk-badging.txt"
          ! grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$APK"
      - name: Retirar material privado del ejecutor
        if: always()
        run: rm -f "$RUNNER_TEMP/bum-release.p12" android/app/google-services.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bum-Bum-Costos-Android-firmado
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
