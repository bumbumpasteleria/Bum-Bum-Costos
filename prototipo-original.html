<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bum Bum Costos</title><style>:root{font-family:system-ui,Arial;color:#342b2c;background:#faf6f3}*{box-sizing:border-box}body{margin:0}header{background:#783640;color:white;padding:18px}header h1{margin:0;font-size:23px}header small{opacity:.85}nav{display:flex;gap:6px;overflow:auto;padding:12px;background:#fff;position:sticky;top:0}button{border:0;border-radius:9px;background:#783640;color:white;padding:10px 13px;cursor:pointer}nav button{white-space:nowrap;background:#eee3e2;color:#552e35}nav button.active{background:#783640;color:white}main{max-width:900px;margin:auto;padding:15px}.panel{background:white;border:1px solid #e9dddd;border-radius:14px;padding:18px;margin-bottom:15px}h2{margin-top:0;font-size:20px}label{display:block;font-size:13px;margin:10px 0 4px;font-weight:600}input,select{width:100%;border:1px solid #d8c9c9;border-radius:8px;padding:11px;font:inherit}form .grid,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.muted{color:#766d6e;font-size:13px}.metric{background:#f6eeec;padding:15px;border-radius:12px}.metric b{display:block;font-size:21px;margin-top:5px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #eee;padding:9px 5px} .scroll{overflow:auto}.hidden{display:none}.danger{background:#9a3434}.secondary{background:#eee3e2;color:#552e35}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{padding:8px}.note{border-left:4px solid #a8777d;padding:10px;background:#f7eeee}.right{text-align:right}footer{text-align:center;color:#786e6e;padding:25px;font-size:12px}</style></head><body><header><h1>🎂 Bum Bum Costos</h1><small>Tu pastelería, tus números, tu control</small></header><nav id="nav"></nav><main id="app"></main><footer>Prototipo local · Los datos se guardan en este navegador. Haz respaldos periódicos.</footer><script>
const tabs=['Inicio','Ingredientes','Recetas','Cotizador','Ventas','Respaldo'];let tab='Inicio';const KEY='bum-bum-costos-v1';const fresh=()=>({ingredients:[],recipes:[],quotes:[],sales:[],settings:{}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}for(const k of ['ingredients','recipes','quotes','sales'])if(!Array.isArray(db[k]))db[k]=[];
const $=id=>document.getElementById(id), money=n=>'RD$ '+Number(n||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2}),num=x=>Math.max(0,Number(x)||0),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),cost=i=>num(i.price)/Math.max(.000001,num(i.packageQty)),recipeCost=r=>r.lines.reduce((sum,l)=>sum+num(l.qty)*cost(db.ingredients.find(i=>i.id===l.ingredientId)||{price:0,packageQty:1}),0),options=(items,placeholder)=>`<option value="">${placeholder}</option>`+items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');function go(t){tab=t;render()}function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('app').innerHTML=({Inicio:home,Ingredientes:ingredients,Recetas:recipes,Cotizador:quotes,Ventas:sales,Respaldo:backup}[tab])();bind()}
function home(){let revenue=db.sales.reduce((s,v)=>s+num(v.gross),0),profit=db.sales.reduce((s,v)=>s+num(v.gross)*(1-num(v.commission)/100)-num(v.extra)-num(v.productionCost),0);return `<section class="panel"><h2>Resumen general</h2><div class="grid"><div class="metric">Ventas registradas<b>${money(revenue)}</b></div><div class="metric">Resultado estimado<b>${money(profit)}</b></div><div class="metric">Ingredientes<b>${db.ingredients.length}</b></div><div class="metric">Recetas<b>${db.recipes.length}</b></div></div><p class="muted">Resultados de todas las ventas registradas; no equivalen al saldo de caja ni a utilidad contable completa.</p></section><section class="panel"><h2>Empieza aquí</h2><p>1. Agrega ingredientes y sus precios. 2. Crea una receta con cantidades. 3. Cotiza un pastel. 4. Registra ventas.</p><p class="note">Versión inicial: inventario, importación de archivos y contabilidad avanzada todavía no están implementados.</p></section>`}
function ingredients(){return `<section class="panel"><h2>Nuevo ingrediente</h2><form id="ingredientForm"><div class="grid"><div><label>Nombre</label><input name="name" required placeholder="Harina de trigo"></div><div><label>Precio de última compra (RD$)</label><input name="price" type="number" step=".01" min="0" required></div><div><label>Cantidad en presentación</label><input name="packageQty" type="number" step=".001" min=".001" required></div><div><label>Unidad de medida</label><select name="unit"><option>g</option><option>ml</option><option>unidad</option></select></div></div><p class="muted">Ejemplo: funda de harina de 5 lb = 2267.96 g. Introduce el precio de la funda y 2267.96 como cantidad.</p><button>Guardar ingrediente</button></form></section><section class="panel"><h2>Lista de ingredientes</h2><div class="scroll"><table><thead><tr><th>Ingrediente</th><th>Compra</th><th>Costo unitario</th><th></th></tr></thead><tbody>${db.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${money(i.price)} / ${i.packageQty} ${esc(i.unit)}</td><td>${money(cost(i))}/${esc(i.unit)}</td><td><button class="secondary" data-edit-ingredient="${i.id}">Editar</button></td></tr>`).join('')||'<tr><td colspan="4">Aún no hay ingredientes.</td></tr>'}</tbody></table></div></section>`}
function recipes(){return `<section class="panel"><h2>Nueva receta</h2><form id="recipeForm"><div class="grid"><div><label>Nombre</label><input name="name" required placeholder="Bizcocho de vainilla"></div><div><label>Rendimiento de referencia</label><input name="yield" type="number" min=".001" step=".001" value="1" required></div><div><label>Unidad de rendimiento</label><input name="yieldUnit" value="lb comercial" required></div><div><label>Tipo</label><select name="scaling"><option value="scalable">Escalable</option><option value="fixed">Fija</option></select></div></div><h3>Ingredientes de la receta</h3><div id="recipeLines"></div><div class="row"><button type="button" class="secondary" id="addLine">+ Añadir ingrediente</button><button>Guardar receta</button></div></form></section><section class="panel"><h2>Recetario</h2>${db.recipes.map(r=>`<div class="metric" style="margin-bottom:9px"><b style="font-size:16px">${esc(r.name)}</b><span>${esc(r.scaling==='fixed'?'Fija':'Escalable')} · ${r.yield} ${esc(r.yieldUnit)} · Costo actual ${money(recipeCost(r))}</span><div class="row" style="margin-top:8px"><button class="secondary" data-delete-recipe="${r.id}">Eliminar</button></div></div>`).join('')||'<p class="muted">Crea tu primera receta.</p>'}</section>`}
function addLine(){let wrap=$('recipeLines');if(!wrap)return;let div=document.createElement('div');div.className='grid';div.innerHTML=`<div><label>Ingrediente</label><select class="lineIngredient" required>${options(db.ingredients,'Seleccionar')}</select></div><div><label>Cantidad</label><input class="lineQty" type="number" min=".001" step=".001" required></div><div style="align-self:end"><button type="button" class="secondary removeLine">Quitar</button></div>`;wrap.appendChild(div);div.querySelector('.removeLine').onclick=()=>div.remove()}
function quotes(){return `<section class="panel"><h2>Cotizador de pasteles</h2><form id="quoteForm"><div class="grid"><div><label>Receta</label><select id="qRecipe" required>${options(db.recipes,'Seleccionar receta')}</select></div><div><label>Cantidad de rendimientos</label><input id="qQty" type="number" min=".001" step=".001" value="1" required></div><div><label>Rellenos y coberturas (RD$)</label><input id="qFill" type="number" min="0" step=".01" value="0"></div><div><label>Decoración (RD$)</label><input id="qDecor" type="number" min="0" step=".01" value="0"></div><div><label>Empaque (RD$)</label><input id="qPack" type="number" min="0" step=".01" value="0"></div><div><label>Entrega (RD$)</label><input id="qDelivery" type="number" min="0" step=".01" value="0"></div><div><label>Otros gastos (RD$)</label><input id="qOther" type="number" min="0" step=".01" value="0"></div><div><label>Mano de obra</label><select id="qLaborMode"><option value="fixed">Monto fijo</option><option value="hourly">Horas × tarifa</option></select></div><div><label>Monto fijo o tarifa por hora (RD$)</label><input id="qLabor" type="number" min="0" step=".01" value="0"></div><div><label>Horas (si corresponde)</label><input id="qHours" type="number" min="0" step=".25" value="1"></div><div><label>Método de precio</label><select id="qMethod"><option value="margin">Margen sobre venta</option><option value="markup">Recargo sobre costo</option></select></div><div><label>Porcentaje (%)</label><input id="qPercent" type="number" min="0" max="95" step=".1" value="35"></div></div><p class="muted">En recetas fijas, el costo se multiplica por el número de tandas completas (redondeado hacia arriba).</p><div id="quoteResult" class="metric" style="margin:15px 0">Selecciona una receta para calcular.</div><button>Guardar cotización</button></form></section><section class="panel"><h2>Cotizaciones guardadas</h2><div class="scroll"><table><tr><th>Fecha</th><th>Receta</th><th>Costo</th><th>Precio</th></tr>${db.quotes.slice().reverse().map(q=>`<tr><td>${esc(q.date)}</td><td>${esc(q.recipeName)}</td><td>${money(q.totalCost)}</td><td>${money(q.price)}</td></tr>`).join('')}</table></div></section>`}
function quoteCalc(){let r=db.recipes.find(x=>x.id===$('qRecipe')?.value);if(!r)return null;let qty=num($('qQty').value),recipeTotal=recipeCost(r)*(r.scaling==='fixed'?Math.ceil(qty):qty),labor=num($('qLabor').value)*($('qLaborMode').value==='hourly'?num($('qHours').value):1),totalCost=recipeTotal+labor+['qFill','qDecor','qPack','qDelivery','qOther'].reduce((s,k)=>s+num($(k).value),0),pct=num($('qPercent').value),method=$('qMethod').value,price=method==='margin'?totalCost/(1-Math.min(pct,95)/100):totalCost*(1+pct/100);return {recipeName:r.name,qty,recipeTotal,labor,totalCost,price,profit:price-totalCost,method,pct,date:new Date().toISOString().slice(0,10)}}function updateQuote(){if(!$('quoteResult'))return;let q=quoteCalc();$('quoteResult').innerHTML=q?`<div>Costo de bizcocho: ${money(q.recipeTotal)}</div><div>Mano de obra: ${money(q.labor)}</div><div>Costo total: <strong>${money(q.totalCost)}</strong></div><h2>Precio sugerido: ${money(q.price)}</h2><div>Utilidad estimada: ${money(q.profit)}</div>`:'Selecciona una receta para calcular.'}
function sales(){return `<section class="panel"><h2>Registrar venta manual</h2><form id="saleForm"><div class="grid"><div><label>Fecha</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>Canal</label><select name="channel" id="sChannel"><option value="Uber Eats">Uber Eats</option><option value="PedidosYa">PedidosYa</option><option value="Directa">Directa / WhatsApp</option></select></div><div><label>Descripción</label><input name="description" placeholder="Tres leches, 2 unidades" required></div><div><label>Venta bruta (RD$)</label><input name="gross" type="number" min="0" step=".01" required></div><div><label>Comisión (%)</label><input name="commission" id="sCommission" type="number" min="0" max="100" step=".01" value="45" required></div><div><label>Costo de producción (RD$)</label><input name="productionCost" type="number" min="0" step=".01" required></div><div><label>Otros descuentos y gastos (RD$)</label><input name="extra" type="number" min="0" step=".01" value="0"></div></div><p class="muted">Registra aquí el costo de producción de la venta. En esta versión todavía no se descuenta automáticamente del inventario.</p><button>Guardar venta</button></form></section><section class="panel"><h2>Ventas registradas</h2><div class="scroll"><table><tr><th>Fecha</th><th>Canal</th><th>Venta</th><th>Resultado</th></tr>${db.sales.slice().reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.channel)}<br><small>${esc(s.description)}</small></td><td>${money(s.gross)}</td><td>${money(num(s.gross)*(1-num(s.commission)/100)-num(s.productionCost)-num(s.extra))}</td></tr>`).join('')}</table></div></section>`}
function backup(){return `<section class="panel"><h2>Respaldo de datos</h2><p>Descarga un archivo JSON con tus ingredientes, recetas, cotizaciones y ventas. Guárdalo fuera del navegador.</p><button id="export">Descargar respaldo</button><h3>Restaurar respaldo</h3><input id="import" type="file" accept=".json,application/json"><p class="note">Restaurar reemplaza todos los datos actuales. Los archivos Excel/CSV de ventas se añadirán en una versión posterior.</p></section>`}
function bind(){if(tab==='Ingredientes'){$('ingredientForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.ingredients.push({id:id(),name:f.get('name').trim(),price:num(f.get('price')),packageQty:num(f.get('packageQty')),unit:f.get('unit')});save();render()};document.querySelectorAll('[data-edit-ingredient]').forEach(b=>b.onclick=()=>{let i=db.ingredients.find(x=>x.id===b.dataset.editIngredient);let p=prompt('Nuevo precio de última compra (RD$)',i.price);if(p!==null&&p.trim()!==''&&Number.isFinite(Number(p))&&Number(p)>=0){i.price=Number(p);save();render()}})}if(tab==='Recetas'){$('addLine').onclick=addLine;if(db.ingredients.length)addLine();$('recipeForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),lines=[...document.querySelectorAll('#recipeLines>.grid')].map(x=>({ingredientId:x.querySelector('.lineIngredient').value,qty:num(x.querySelector('.lineQty').value)}));if(!lines.length||lines.some(x=>!x.ingredientId||!x.qty)){alert('Añade al menos un ingrediente con cantidad válida.');return}db.recipes.push({id:id(),name:f.get('name').trim(),yield:num(f.get('yield')),yieldUnit:f.get('yieldUnit'),scaling:f.get('scaling'),lines});save();render()};document.querySelectorAll('[data-delete-recipe]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta receta?')){db.recipes=db.recipes.filter(x=>x.id!==b.dataset.deleteRecipe);save();render()}})}if(tab==='Cotizador'){document.querySelectorAll('#quoteForm input,#quoteForm select').forEach(x=>x.addEventListener('input',updateQuote));$('quoteForm').onsubmit=e=>{e.preventDefault();let q=quoteCalc();if(!q||!q.qty){alert('Selecciona una receta y cantidad válida.');return}db.quotes.push({id:id(),...q});save();render();alert('Cotización guardada')};updateQuote()}if(tab==='Ventas'){$('sChannel').onchange=e=>{$('sCommission').value=e.target.value==='Uber Eats'?'45':e.target.value==='Directa'?'0':'0'};$('saleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s={id:id()};for(let [k,v]of f)s[k]=['gross','commission','productionCost','extra'].includes(k)?num(v):String(v);db.sales.push(s);save();render()}}if(tab==='Respaldo'){$('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bum-bum-costos-respaldo.json';a.click();URL.revokeObjectURL(url)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.ingredients)||!Array.isArray(data.recipes)||!Array.isArray(data.sales)||!Array.isArray(data.quotes))throw Error('Formato no válido');if(confirm('¿Reemplazar todos los datos actuales?')){db=data;save();render()}}catch(err){alert('No se pudo restaurar: '+err.message)}}}}
render();</script></body></html>
